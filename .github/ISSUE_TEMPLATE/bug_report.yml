name: Bug report
description: Report something that is broken in the Horizon Client (React + Vite)
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Horizon. Please search [existing issues](https://github.com/Horizon-Truth/horizon-truth-client-v2/issues) first, and read our [Code of Conduct](https://github.com/Horizon-Truth/horizon-truth-client-v2/blob/main/CODE_OF_CONDUCT.md).
        **Security issues must not be reported here.** Use the private security advisory link on the issue chooser.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am using the latest `main` or `dev` code
          required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Game / simulation
        - Authentication / onboarding
        - Dashboard / analytics / reports
        - Resources / blogs / public pages
        - Admin / organizations
        - Internationalization (en / am / om)
        - Accessibility
        - Design / UI
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Add screenshots or a screen recording where it helps.
      placeholder: |
        1. Go to ...
        2. Click / call ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Chrome 130, Safari 18, Firefox 132"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / OS
      placeholder: "e.g. Windows 11 desktop, Pixel 8 Android 15"
    validations:
      required: true

  - type: input
    id: lang
    attributes:
      label: App language
      placeholder: "en / am / om"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Browser console output / network errors
      description: Paste relevant output. It is formatted as code automatically.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, related issues, possible cause, anything else.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on a fix for this
