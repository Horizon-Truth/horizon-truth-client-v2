name: Deploy Frontend (Caddy)

on:
  push:
    branches:
      - main
      - dev
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Determine deployment directory
        id: set-dir
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "DEPLOY_SUBDIR=current" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "DEPLOY_SUBDIR=dev" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "stage" ]]; then
            echo "DEPLOY_SUBDIR=stage" >> $GITHUB_ENV
          fi
          echo "Selected directory: $DEPLOY_SUBDIR"

      - name: Deploy frontend to server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e

          DEPLOY_DIR="$DEPLOY_SUBDIR"

          echo "Deploying to directory: $DEPLOY_DIR"

          # Create deployment directory
          ssh -o StrictHostKeyChecking=no $USER@$HOST << EOF
            mkdir -p $DEPLOY_PATH/$DEPLOY_DIR
          EOF

          # Sync built files to server (dist folder)
          rsync -avz --delete dist/ $USER@$HOST:$DEPLOY_PATH/$DEPLOY_DIR/

          # Set proper permissions (optional but recommended)
          ssh -o StrictHostKeyChecking=no $USER@$HOST << EOF
            chmod -R 755 $DEPLOY_PATH/$DEPLOY_DIR
          EOF