name: Deploy Frontend (Caddy)

on:
  push:
    branches:
      - main
      - dev
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Determine branch environment
      - name: Set deployment environment
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "DEPLOY_SUBDIR=current" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "VITE_API_URL=${{ secrets.VITE_API_URL_PROD }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "stage" ]]; then
            echo "DEPLOY_SUBDIR=stage" >> $GITHUB_ENV
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "VITE_API_URL=${{ secrets.VITE_API_URL_STAGE }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "DEPLOY_SUBDIR=dev" >> $GITHUB_ENV
            echo "ENVIRONMENT=development" >> $GITHUB_ENV
            echo "VITE_API_URL=${{ secrets.VITE_API_URL_DEV }}" >> $GITHUB_ENV
          fi

      # 5️⃣ Create .env dynamically
      - name: Create environment file
        run: |
          echo "VITE_API_URL=$VITE_API_URL" > .env
          echo "NODE_ENV=$ENVIRONMENT" >> .env

      # 6️⃣ Build frontend
      - name: Build Frontend
        run: npm run build

      # 7️⃣ Setup SSH agent
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # 8️⃣ Deploy to server
      - name: Deploy frontend to server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e

          echo "Deploying to directory: $DEPLOY_SUBDIR"

          # Create directory if not exists
          ssh -o StrictHostKeyChecking=no $USER@$HOST << EOF
            mkdir -p $DEPLOY_PATH/$DEPLOY_SUBDIR
          EOF

          # Sync built files
          rsync -avz --delete dist/ $USER@$HOST:$DEPLOY_PATH/$DEPLOY_SUBDIR/

          # Set permissions
          ssh -o StrictHostKeyChecking=no $USER@$HOST << EOF
            chmod -R 755 $DEPLOY_PATH/$DEPLOY_SUBDIR
          EOF

          echo "Deployment completed successfully 🚀"